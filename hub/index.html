<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F.Learning Tools</title>
<meta name="description" content="Free tools by F.Learning Studio.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --paper: #EFF3F3; --surface: #FFFFFF; --surface-2: #F6F9F9;
    --ink: #0B1A1F; --muted: #5C7073; --hairline: #D5E0E0; --accent: #10726B;
    --shadow: 0 1px 2px rgba(11,26,31,.06), 0 8px 24px rgba(11,26,31,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0A1214; --surface: #121D20; --surface-2: #172427;
      --ink: #E4EEEE; --muted: #91A6A8; --hairline: #27383C; --accent: #57C9BE;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --paper: #0A1214; --surface: #121D20; --surface-2: #172427;
    --ink: #E4EEEE; --muted: #91A6A8; --hairline: #27383C; --accent: #57C9BE;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 56px; }
  @media (min-width: 640px) { .wrap { padding-inline: 20px; padding-block: 44px 72px; } }

  h1 { font: 700 26px/1.15 Archivo, system-ui, sans-serif; letter-spacing: -.02em; margin: 0 0 4px; }
  .sub { margin: 0 0 28px; color: var(--muted); }

  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .card { display: grid; gap: 10px; padding: 10px 10px 14px; border-radius: 10px; text-decoration: none; color: inherit;
    background: var(--surface); border: 1px solid var(--hairline); box-shadow: var(--shadow);
    transition: border-color .15s, transform .15s; }
  .card:hover { border-color: var(--ink); transform: translateY(-1px); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; display: block;
    background: var(--surface-2); }
  .card h2 { font: 700 16px/1.2 Archivo, system-ui, sans-serif; margin: 0 4px; letter-spacing: -.01em; }
  .card p { margin: 0 4px; color: var(--muted); font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
</style>
</head>
<body>
<main class="wrap">
  <h1>F.Learning Tools</h1>
  <p class="sub">Free tools by F.Learning Studio.</p>
  <div class="grid" id="tools"></div>
</main>

<script>
  // Danh sách tool trên sảnh. Thêm tool mới = thêm một dòng ở đây
  // (và một rewrite trong firebase.json nếu tool có service Cloud Run riêng).
  var TOOLS = [
    { href: "/brandkit/", name: "Brand Kit", text: "Paste your website — get the deck in your brand colors and logo.",
      img: "/brandkit/templates/mpc/p01/thumb.png" }
  ];

  var box = document.getElementById("tools");
  TOOLS.forEach(function (t) {
    var a = document.createElement("a"); a.className = "card"; a.href = t.href;
    var im = document.createElement("img"); im.src = t.img; im.alt = ""; im.loading = "lazy";
    var h = document.createElement("h2"); h.textContent = t.name;
    var p = document.createElement("p"); p.textContent = t.text;
    a.append(im, h, p);
    box.appendChild(a);
  });
</script>
</body>
</html>
